<div class="max-w-xl mx-auto bg-white shadow-xl rounded-lg overflow-hidden">
        
        <!-- Header Section (Themed as a warning area) -->
        <div class="bg-amber-600 p-4 text-white flex items-center">
            <svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            <h2 class="text-lg font-semibold">Active Login Sessions</h2>
        </div>

        <!-- List Content Area -->
        <div class="p-6 divide-y divide-gray-200">
            
            <!-- Simulated Loop Output (Replace with your actual loop syntax) -->
            @for(key of keys; track $index) {
                 <div class="flex justify-between items-center py-3">
                    <!-- Key (Device ID) -->
                    <div class="font-mono text-sm text-gray-700 truncate mr-4 " [class]="key===currentDeviceId?'text-red-700':''">
                        Device Id: <span class="font-semibold">{{key}}</span>
                    </div>
                    <!-- Value (Timestamp) -->
                    <div class="text-sm text-amber-600 whitespace-nowrap" [class]="key===currentDeviceId?'text-red-700':''">
                        Login Time: <span>{{values[$index] | date:'dd/MM/yyyy HH:mm'}}</span>
                    </div>
                </div>
               }

               

        </div>
    </div>
