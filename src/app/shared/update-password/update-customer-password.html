<div class="w-[50%] mx-auto my-5 p-5 border border-gray-300 rounded-lg bg-[#FAFAFA] shadow-md">
  <h3 class="text-lg font-bold mb-5">Set new password</h3>
  <form (ngSubmit)="submitListing(listingForm)" #listingForm="ngForm" class="space-y-4">
    <div>
      <label class="block font-bold mb-1">New Password</label>
      <div class="flex  border border-gray-400 rounded focus:border-blue-500">
        <input [type]="seePassword ? 'text':'password'" [(ngModel)]="this.password" name="password" #password="ngModel"
          required class="w-full px-3 py-2 text-sm focus:outline-none "
          pattern="^(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&+=])(?=\S+$).{8,20}$" />
        <span class="mr-[4px] mt-[6px]" (click)="togglePassword()" [class]="{'show-icon': seePassword, 'hide-icon': !seePassword}">

          <i *ngIf="!seePassword" class="fas fa-eye"></i>
          <i *ngIf="seePassword" class="fas fa-eye-slash"></i>
        </span>
      </div>
    </div>
    <div *ngIf="password.invalid && (password.dirty || password.touched)" class="text-red-500 mt-1">
      <div *ngIf="password.errors?.['pattern']">
        Password must be 8–20 characters long and include numbers, special characters, and
        both uppercase and lowercase letters.
      </div>
    </div>
    <button type="submit"
      class="w-full px-4 py-2 bg-gray-900 text-white font-bold rounded hover:bg-gray-600 transition">
      Submit
    </button>
    <button type="button" (click)="reset(listingForm)"
      class="w-full px-4 py-2 bg-gray-900 text-blue-50 font-bold rounded hover:bg-gray-600 transition">
      Reset
    </button>
  </form>
</div>
